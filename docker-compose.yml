services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Override the .env path so it points at the mounted volume.
      DATABASE_PATH: /data/myway.db
    volumes:
      - myway-data:/data
      - myway-models:/models
    # Whisper's small model wants roughly 1GB resident; raise this if you move
    # WHISPER_MODEL up to medium or large.
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  myway-data:
  myway-models:
